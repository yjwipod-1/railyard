name: Railyard validation

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

jobs:
  validate:
    name: Public v0.8 validation (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: ${{ runner.temp }}/railyard-pycache
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Compile public scripts
        run: python -m compileall -q scripts

      - name: Validate public artifacts
        run: python scripts/validate_artifacts.py --project-root .

      - name: Run clean-workspace CI contract harness
        run: python scripts/test_runtime_v080_ci.py

      - name: Run complete public v0.8 regression census
        run: python scripts/runtime_v080_regression.py

      - name: Run all public v0.8 smoke scenarios
        run: python scripts/runtime_v080_smoke.py --tmp-dir "${{ runner.temp }}/railyard-v080-smoke" --all run

      # Optional MCP-lite coverage is separate from the offline public v0.8 gate.
      - name: Install optional MCP-lite dependencies
        if: hashFiles('requirements-mcp.txt') != ''
        continue-on-error: true
        run: python -m pip install -r requirements-mcp.txt

      - name: Probe optional MCP-lite server
        if: hashFiles('requirements-mcp.txt') != ''
        continue-on-error: true
        run: python scripts/probe_railyard_mcp_server.py --db "${{ runner.temp }}/railyard-ci-mcp/.workflow/workflow.db" --project-root .
