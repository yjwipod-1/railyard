name: Railyard validation

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile scripts
        run: python -m compileall scripts

      - name: Validate artifacts
        run: python scripts/validate_artifacts.py

      - name: Install MCP-lite dependencies
        if: hashFiles('requirements-mcp.txt') != ''
        run: python -m pip install -r requirements-mcp.txt

      - name: Probe MCP-lite server
        if: hashFiles('requirements-mcp.txt') != ''
        run: |
          mkdir -p .tmp/ci-mcp-lite/.workflow
          python scripts/workflow_schema.py ensure --db .tmp/ci-mcp-lite/.workflow/workflow.db
          python scripts/probe_railyard_mcp_server.py --db .tmp/ci-mcp-lite/.workflow/workflow.db --project-root .tmp/ci-mcp-lite
